enabled_layouts splits,stack
allow_remote_control socket-only
listen_on unix:/tmp/kitty

# Tokyo Night - Kitty
remember_window_size no
initial_window_width 800
initial_window_height 400
window_padding_width 6

# window_border_width 1
hide_window_decorations no
background          #1a1b26
background_opacity 0.7
foreground          #a9b1d6

# Cursor settings
cursor              #c0caf5
cursor_trail 200
cursor_trail_decay 0.1 0.2
cursor_trail_start_threshold 2
cursor_text_color   #1a1b26
selection_background #33467c
selection_foreground #c0caf5

# colors
url_color           #73daca
color0  #32344a
color1  #f7768e
color2  #73daca
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #787c99
color8  #444b6a
color9  #ff7a93
color10 #b9f27c
color11 #ff9e64
color12 #7da6ff
color13 #bb9af7
color14 #0db9d7
color15 #acb0d0

# Font
font_family FiraCode Nerd Font Mono
bold_font   auto
italic_font auto
font_size   12.0
bold_italic_font auto

# Options
scrollback_lines 5000
scrollback_pager_history_size 10
mouse_hide_wait -3.0
notify_on_cmd_finish invisible 20
enable_audio_bell no
visual_bell_duration 0

# Mappings
# Window Splits
map ctrl+a>v launch --location=vsplit --cwd=current
map ctrl+a>s launch --location=hsplit --cwd=current
map ctrl+a>| launch --location=vsplit --cwd=current
map ctrl+a>- launch --location=hsplit --cwd=current

# Navigation
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

# Layout
map ctrl+a>z toggle_layout stack

# Tabs
map ctrl+a>c new_tab_with_cwd
map ctrl+a>& close_tab
map ctrl+a>x close_window
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3

map ctrl+shift+h launch --stdin-source=@screen_scrollback --type=overlay nvim -R -c "set nomodifiable" -c "xnoremap <buffer> y \"+y:qa!<CR>" -c "nnoremap <buffer> q :qa!<CR>" -c "normal G" -c "?." -c "noh" -
map ctrl+a>[     launch --stdin-source=@screen_scrollback --type=overlay nvim -R -c "set nomodifiable" -c "xnoremap <buffer> y \"+y:qa!<CR>" -c "nnoremap <buffer> q :qa!<CR>" -c "normal G" -c "?." -c "noh" -
