console_title_template = '{{ .Shell }} in {{ .Folder }}'
version = 4
final_space = true

[upgrade]
  source = 'cdn'
  interval = '168h'
  auto = false
  notice = false

[[blocks]]
    type = "prompt"
    alignment = "left"
    newline = true

  [[blocks.segments]]
      type = "path"
      style = "plain"
      foreground = "blue"
      background = "transparent"
      template = '{{ .Path }}'

    [blocks.segments.options]
        style = "full"
    
    [[blocks.segments]]
        type = 'git'
        style = 'plain'
        foreground = 'cyan'
        background = 'transparent'
        template = ' {{ .HEAD }}{{ if or (.Working.Changed) (.Staging.Changed) }}*{{ end }} '

        [blocks.segments.options]
            commit_icon = '@'
            fetch_status = true

[[blocks]]
    type = 'rprompt'
    overflow = 'hidden'
    
    [[blocks.segments]]
        type = 'executiontime'
        style = 'plain'
        foreground = 'yellow'
        background = 'transparent'
        template = '{{ .FormattedMs }}'

        [blocks.segments.properties]
            threshold = 5000

[[blocks]]
    type = 'prompt'
    alignment = 'left'
    newline = true

  [[blocks.segments]]
    type = 'text'
    style = 'plain'
    foreground_templates = [
        "{{if gt .Code 0}}red{{end}}",
        "{{if eq .Code 0}}magenta{{end}}",
        ]
    background = 'transparent'
    template = '❯'

[transient_prompt]
    foreground_templates = [
        "{{if gt .Code 0}}red{{end}}",
        "{{if eq .Code 0}}magenta{{end}}",
        ]
    background = 'transparent'
    template = '❯ '

